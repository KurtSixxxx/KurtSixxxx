<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Giulio Casella - Computer Science Student, aspiring Penetration Tester">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="12" fill="#0d1117"/>
  <rect width="1200" height="300" rx="12" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="12" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="12" fill="none" stroke="#30363d"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="96" font-size="16" fill="#6e7681">~/portfolio <tspan fill="#3fb950">$</tspan> <tspan fill="#8b949e">whoami</tspan></text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="70" y="166" font-size="58" font-weight="600" fill="#e6edf3" letter-spacing="-1">Giulio Casella</text>
    <text x="72" y="208" font-size="22" fill="#8b949e">Computer Science Student  ·  University of Catania</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#6e7681" letter-spacing="1">
    <text x="72" y="252">Programming   ·   Cybersecurity   ·   Penetration Testing</text>
  </g>

  <rect x="72" y="226" width="40" height="2" fill="#3fb950"/>
</svg>
